name: Playwright Tests

on:
  pull_request:
  push:
    branches: [main]
  # Daily run catches the app changing underneath the tests, not just code changes.
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Non-secret settings: Settings → Secrets and variables → Actions → Variables
      TEST_ENV: ${{ vars.TEST_ENV || 'staging' }}
      BASE_URL: ${{ vars.BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      BROWSERS: ${{ vars.BROWSERS || 'chromium' }}
      # Secrets: Settings → Secrets and variables → Actions → Secrets
      TEST_USER: ${{ secrets.TEST_USER }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, format check
        run: npm run check

      - name: Install browsers
        run: npx playwright install --with-deps ${BROWSERS//,/ }

      - name: Run tests
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Notify Slack on failure
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          text=":x: Playwright tests failed on *${{ github.repository }}* (${{ github.head_ref || github.ref_name }}, env: $TEST_ENV). <$run_url|Open run and report>"
          jq -n --arg text "$text" '{text: $text}' \
            | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
